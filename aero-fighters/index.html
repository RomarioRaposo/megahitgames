<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aero Fighters - MegaHit Games</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <header class="hud">
      <a href="../index.html" class="btn-back">← Voltar</a>
      <div class="stats">
        <span>SCORE: <b id="score-val">0</b></span>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>

      <div id="start-screen" class="overlay">
        <h1>AERO FIGHTERS</h1>
        <p>Setas ou Touch para Mover | Espaço para Atirar</p>
        <button id="start-btn" class="btn-action">INICIAR MISSÃO</button>
      </div>

      <div id="game-over-screen" class="overlay hidden">
        <h1>MISSÃO FALHOU</h1>
        <p>Pontuação Final: <span id="final-score">0</span></p>
        <button id="restart-btn" class="btn-action">NOVA TENTATIVA</button>
      </div>
    </div>

    <!-- Controles Mobile -->
    <div class="mobile-controls">
      <div class="dpad">
        <button id="btn-left" class="ctrl-btn">◀</button>
        <button id="btn-right" class="ctrl-btn">▶</button>
      </div>
      <button id="btn-fire" class="fire-btn">FIRE 🔥</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
