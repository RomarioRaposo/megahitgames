<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BANG! The Dice Game - MegaHit Games</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --secondary-color: #475569;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    body.dark-theme {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .back-btn { color: var(--primary-color); text-decoration: none; font-weight: 700; font-size: 0.85rem; }
    h1 { font-size: 1.1rem; font-weight: 800; }

    .header-actions { display: flex; gap: 0.4rem; align-items: center; }

    .theme-btn, .info-btn {
      background: transparent; border: 1px solid var(--border-color);
      color: var(--text-color); padding: 0.4rem 0.6rem; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.8rem;
    }

    main { flex: 1; max-width: 950px; width: 100%; margin: 0.75rem auto; padding: 0 0.5rem; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 0.75rem; box-shadow: var(--shadow); }
    .hidden { display: none !important; }

    .form-group { display: flex; flex-direction: column; gap: 0.75rem; max-width: 380px; margin: 0.75rem auto; }
    input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 10px; background: transparent; color: var(--text-color); font-size: 0.95rem; }
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .btn { padding: 0.75rem; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-primary { background-color: var(--primary-color); color: #fff; }
    .btn-secondary { background-color: var(--secondary-color); color: #fff; }
    .btn-success { background-color: var(--success-color); color: #fff; }
    .btn-danger { background-color: var(--danger-color); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .rooms-list { margin-top: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem; }
    .room-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.4rem; font-size: 0.85rem; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.75rem; font-size: 0.85rem; }
    .badge { background: var(--border-color); padding: 0.2rem 0.4rem; border-radius: 6px; font-weight: 700; }

    /* LAYOUT DA MESA: EXATAMENTE 3 POR LINHA NO MOBILE */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    
    /* Para celulares extremamente pequenos (<=360px), reduz para 2 por linha */
    @media (max-width: 360px) {
      .players-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Para telas maiores (Tablets e Desktops) */
    @media (min-width: 640px) {
      .players-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
    }

    .player-card {
      border: 2px solid var(--border-color); border-radius: 10px; padding: 0.35rem 0.25rem; text-align: center;
      background: var(--card-bg); position: relative; transition: all 0.2s; cursor: pointer; user-select: none;
    }
    .player-card.active-turn { border-color: var(--primary-color); box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
    .player-card.is-me { background-color: rgba(217, 119, 6, 0.08); }
    
    .player-card.targetable {
      border-color: var(--success-color) !important;
      background-color: rgba(22, 163, 74, 0.25) !important;
      animation: pulse 0.8s infinite alternate;
    }
    .player-card.dead { opacity: 0.35; filter: grayscale(100%); cursor: not-allowed; }

    @keyframes pulse { 
      0% { transform: scale(1); box-shadow: 0 0 3px var(--success-color); } 
      100% { transform: scale(1.03); box-shadow: 0 0 10px var(--success-color); } 
    }

    .player-name { font-weight: 700; font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-char { font-size: 0.65rem; color: var(--primary-color); font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-ability { font-size: 0.55rem; color: var(--text-muted); margin: 2px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 1.8em; line-height: 0.9; }
    .player-role { font-size: 0.6rem; font-weight: 700; color: var(--secondary-color); background: var(--border-color); border-radius: 4px; padding: 1px 3px; display: inline-block; }
    .player-stats { display: flex; justify-content: space-around; margin-top: 0.25rem; font-size: 0.7rem; font-weight: 800; }

    .arrow-bank { text-align: center; background: rgba(220, 38, 38, 0.1); border: 1px dashed var(--danger-color); padding: 0.4rem; border-radius: 8px; margin-bottom: 0.75rem; font-size: 0.85rem; font-weight: 700; }
    
    .legend-box {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.3rem;
      background: var(--bg-color); border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 8px; margin-bottom: 0.75rem; font-size: 0.65rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.2rem; }

    .dice-area { background-color: var(--bg-color); border-radius: 12px; padding: 0.75rem; text-align: center; }
    .dice-container { display: flex; justify-content: center; gap: 0.4rem; margin: 0.75rem 0; flex-wrap: wrap; }
    
    .die {
      width: 44px; height: 44px; background-color: var(--card-bg); border: 2px solid var(--primary-color);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
      font-weight: bold; cursor: pointer; user-select: none; transition: 0.2s;
    }
    .die.kept { border-color: var(--success-color); background-color: rgba(22, 163, 74, 0.15); }
    .die.locked { border-color: var(--danger-color); cursor: not-allowed; opacity: 0.8; }

    .controls-row { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .log-box { margin-top: 0.75rem; max-height: 100px; overflow-y: auto; text-align: left; background: var(--card-bg); padding: 0.4rem; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.75rem; }

    .modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
      max-width: 450px; width: 100%; padding: 1.25rem; max-height: 85vh; overflow-y: auto; text-align: center;
    }
    .modal-content h3 { color: var(--primary-color); margin-bottom: 0.5rem; font-size: 1.2rem; }
    .modal-content p, .modal-content ul { font-size: 0.85rem; line-height: 1.4; color: var(--text-color); margin-bottom: 0.5rem; text-align: left; }
    .modal-content ul { padding-left: 1rem; }
  </style>
</head>
<body class="dark-theme">

  <header>
    <div class="brand">
      <a href="../index.html" class="back-btn">← Hub</a>
      <h1>🌵 BANG! The Dice Game</h1>
    </div>
    <div class="header-actions">
      <button id="btn-how-to-play" class="info-btn">📜 Regras</button>
      <button id="theme-toggle" class="theme-btn">🌓 Tema</button>
    </div>
  </header>

  <main>
    <!-- LOBBY -->
    <section id="lobby-screen" class="card">
      <div style="text-align:center; margin-bottom: 0.75rem;">
        <h2>ENTRAR NA SALA</h2>
        <p style="color:var(--text-muted); font-size:0.85rem;">Multiplayer online ou Solo com Bots (2 a 8 Jogadores)</p>
      </div>
      
      <div class="form-group">
        <input type="text" id="player-name" placeholder="Seu Apelido" maxlength="12" autocomplete="off">
        <input type="text" id="room-code" placeholder="Código da Sala (ex: BANG1)" maxlength="8" style="text-transform: uppercase;" autocomplete="off">
        
        <div class="actions-grid">
          <button id="btn-create" class="btn btn-primary">Criar Sala</button>
          <button id="btn-join" class="btn btn-secondary">Entrar</button>
        </div>
        <button id="btn-search-rooms" class="btn btn-secondary" style="width:100%;">🔍 BUSCAR SALAS ABERTAS</button>
      </div>

      <div id="rooms-panel" class="rooms-list hidden">
        <h3 style="font-size:0.85rem; margin-bottom:0.4rem;">Salas Disponíveis:</h3>
        <div id="rooms-container"></div>
      </div>
    </section>

    <!-- MESA DO JOGO -->
    <section id="game-screen" class="card hidden">
      <div class="status-bar">
        <div>Sala: <span id="display-room-code" class="badge">---</span></div>
        <div>Função: <span id="display-role" class="badge">???</span></div>
        <button id="btn-close-room" class="btn btn-danger hidden" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">🔴 Fechar Sala</button>
      </div>

      <div class="arrow-bank">
        🏹 Flechas na Reserva: <span id="arrow-count">9</span> / 9
      </div>

      <!-- MESA COM GRID 3 POR LINHA NO MOBILE -->
      <div id="players-board" class="players-grid"></div>

      <div class="legend-box">
        <div class="legend-item">🎯1 : Dist. 1</div>
        <div class="legend-item">🎯2 : Dist. 2</div>
        <div class="legend-item">🍺 : Cura +1</div>
        <div class="legend-item">🏹 : Flecha</div>
        <div class="legend-item">💣 : 3x Perde 1</div>
        <div class="legend-item">🔫 : 3x Geral</div>
      </div>

      <div class="dice-area">
        <div id="pending-box" class="pending-actions-badge hidden" style="background:rgba(217,119,6,0.2); padding:0.3rem; border-radius:6px; font-weight:bold; margin-bottom:0.4rem; font-size:0.8rem;">
          Ações Pendentes: <span id="pending-list">-</span>
        </div>

        <p id="turn-status" style="font-weight:700; min-height:1.2em; font-size: 0.85rem;">Aguardando início...</p>

        <div id="dice-container" class="dice-container"></div>

        <div class="controls-row">
          <button id="btn-add-bot" class="btn btn-secondary hidden">🤖 + Add Bot</button>
          <button id="btn-start" class="btn btn-success hidden">🚀 Iniciar Partida</button>
          <button id="btn-roll" class="btn btn-primary" disabled>🎲 Rolar (<span id="rolls-left">3</span>)</button>
          <button id="btn-resolve" class="btn btn-danger" disabled>⚡ RESOLVER DADOS</button>
          <button id="btn-end" class="btn btn-secondary" disabled>Passar Turno</button>
        </div>

        <div id="game-log" class="log-box"></div>
      </div>
    </section>
  </main>

  <div id="rules-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="modal-title">📜 Regras</h3>
      <div id="modal-body"></div>
      <button id="btn-close-modal" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">Fechar</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvhEL3kMRMYhPK55tcICbLsWFHd45WgB8",
      authDomain: "megahit-games.firebaseapp.com",
      databaseURL: "https://megahit-games-default-rtdb.firebaseio.com",
      projectId: "megahit-games",
      storageBucket: "megahit-games.firebasestorage.app",
      messagingSenderId: "595034446210",
      appId: "1:595034446210:web:01f430b992d529988cd79b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CHARACTERS = [
      { name: "Bart Cassidy", maxHp: 7, ability: "Pode pegar flechas no lugar de sofrer dano." },
      { name: "Paul Regret", maxHp: 7, ability: "Considerado a +1 de distância de todos." },
      { name: "Calamity Janet", maxHp: 7, ability: "Pode usar 🎯1 como 🎯2 e vice-versa." },
      { name: "El Gringo", maxHp: 7, ability: "Quando perde PV, o atacante ganha 1 flecha." },
      { name: "Slab the Killer", maxHp: 7, ability: "Pode usar Cerveja para dobrar dano do tiro." },
      { name: "Pedro Ramirez", maxHp: 7, ability: "Ganha 1 PV extra ao descartar flechas." },
      { name: "Vulture Sam", maxHp: 7, ability: "Recupera +2 PV quando um jogador morre." },
      { name: "Suzy Lafayette", maxHp: 7, ability: "Ganha +1 PV se não tiver tirado dados de tiro." }
    ];

    let localPlayerId = "p_" + Math.random().toString(36).substring(2, 7);
    let currentRoomCode = null;
    let keptDiceIndices = [];
    let activeDicePool = [];
    let isSpectator = false;
    let hasResolvedThisTurn = false;
    let gameEnded = false;

    // DOM
    const lobbyScreen = document.getElementById("lobby-screen");
    const gameScreen = document.getElementById("game-screen");
    const btnCreate = document.getElementById("btn-create");
    const btnJoin = document.getElementById("btn-join");
    const btnSearchRooms = document.getElementById("btn-search-rooms");
    const roomsPanel = document.getElementById("rooms-panel");
    const roomsContainer = document.getElementById("rooms-container");
    const btnAddBot = document.getElementById("btn-add-bot");
    const btnStart = document.getElementById("btn-start");
    const btnRoll = document.getElementById("btn-roll");
    const btnResolve = document.getElementById("btn-resolve");
    const btnEnd = document.getElementById("btn-end");
    const btnCloseRoom = document.getElementById("btn-close-room");
    const rulesModal = document.getElementById("rules-modal");
    const btnHowToPlay = document.getElementById("btn-how-to-play");
    const btnCloseModal = document.getElementById("btn-close-modal");

    document.getElementById("theme-toggle").addEventListener("click", () => document.body.classList.toggle("dark-theme"));
    btnHowToPlay.addEventListener("click", () => showModal("📜 Regras BANG!", null));
    btnCloseModal.addEventListener("click", () => rulesModal.classList.add("hidden"));

    btnCreate.addEventListener("click", () => accessRoom(true));
    btnJoin.addEventListener("click", () => accessRoom(false));

    btnSearchRooms.addEventListener("click", async () => {
      const roomsRef = ref(db, "rooms");
      const snapshot = await get(roomsRef);
      roomsContainer.innerHTML = "";

      if (!snapshot.exists()) {
        roomsContainer.innerHTML = "<p style='font-size:0.8rem;'>Nenhuma sala aberta no momento.</p>";
      } else {
        Object.entries(snapshot.val()).forEach(([code, data]) => {
          const count = Object.keys(data.players || {}).length;
          const statusTxt = data.status === "playing" ? " (Em Andamento)" : ` (${count}/8 jog.)`;
          const div = document.createElement("div");
          div.className = "room-item";
          div.innerHTML = `<span><strong>${code}</strong> ${statusTxt}</span> <button class="btn btn-primary" style="padding:0.25rem 0.5rem; font-size:0.75rem;">Entrar</button>`;
          div.querySelector("button").addEventListener("click", () => {
            document.getElementById("room-code").value = code;
            accessRoom(false);
          });
          roomsContainer.appendChild(div);
        });
      }
      roomsPanel.classList.remove("hidden");
    });

    async function accessRoom(isHost) {
      const name = document.getElementById("player-name").value.trim() || "Pistoleiro";
      let code = document.getElementById("room-code").value.trim().toUpperCase();
      if (!code) return alert("Digite o código da sala!");

      currentRoomCode = code;
      const roomRef = ref(db, `rooms/${code}`);
      const snapshot = await get(roomRef);

      if (isHost) {
        if (snapshot.exists()) {
          const suggestedCode = `${code}${Math.floor(100 + Math.random() * 900)}`;
          alert(`A sala '${code}' já existe! Usando sugestão: '${suggestedCode}'`);
          document.getElementById("room-code").value = suggestedCode;
          currentRoomCode = suggestedCode;
          return accessRoom(true);
        }

        await set(roomRef, {
          status: "waiting", host: localPlayerId, turnIndex: 0, playerOrder: [localPlayerId],
          rollsLeft: 3, diceResults: ["-", "-", "-", "-", "-"], arrowPool: 9,
          players: { [localPlayerId]: { name, hp: 7, maxHp: 7, arrows: 0, role: "Aguardando", isBot: false, alive: true } }
        });
      } else {
        if (!snapshot.exists()) return alert("Sala não encontrada!");
        const data = snapshot.val();
        
        if (data.status === "playing") {
          isSpectator = true;
          alert("A partida já começou! Você entrou como Espectador.");
        } else {
          if (Object.keys(data.players || {}).length >= 8) return alert("Mesa cheia!");
          await update(ref(db, `rooms/${code}/players/${localPlayerId}`), {
            name, hp: 7, maxHp: 7, arrows: 0, role: "Aguardando", isBot: false, alive: true
          });
          await update(ref(db, `rooms/${code}`), { playerOrder: [...(data.playerOrder || []), localPlayerId] });
        }
      }

      lobbyScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      document.getElementById("display-room-code").innerText = currentRoomCode;
      listenRoom();
    }

    btnCloseRoom.addEventListener("click", async () => {
      if (confirm("Fechar e encerrar a sala?")) {
        await remove(ref(db, `rooms/${currentRoomCode}`));
        location.reload();
      }
    });

    btnAddBot.addEventListener("click", async () => {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();
      const count = Object.keys(data.players || {}).length;
      if (count >= 8) return alert("Máximo 8 jogadores!");

      const botId = "bot_" + Math.random().toString(36).substring(2, 6);
      await update(ref(db, `rooms/${currentRoomCode}/players/${botId}`), {
        name: `Bot ${count + 1}`, hp: 7, maxHp: 7, arrows: 0, role: "Aguardando", isBot: true, alive: true
      });
      await update(ref(db, `rooms/${currentRoomCode}`), { playerOrder: [...data.playerOrder, botId] });
    });

    btnStart.addEventListener("click", async () => {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();

      const playerKeys = data.playerOrder;
      const count = playerKeys.length;

      let roles = [];
      if (count === 2) roles = ["Xerife", "Fora-da-Lei"];
      else if (count === 3) roles = ["Xerife", "Fora-da-Lei", "Renegado"];
      else if (count === 4) roles = ["Xerife", "Ajudante", "Fora-da-Lei", "Renegado"];
      else roles = ["Xerife", "Ajudante", "Fora-da-Lei", "Fora-da-Lei", "Renegado", "Fora-da-Lei", "Ajudante", "Fora-da-Lei"].slice(0, count);

      roles.sort(() => Math.random() - 0.5);
      const chars = [...CHARACTERS].sort(() => Math.random() - 0.5);

      const updatedPlayers = {};
      playerKeys.forEach((id, idx) => {
        const role = roles[idx];
        const char = chars[idx % chars.length];
        const isSheriff = role === "Xerife";
        const maxHp = char.maxHp + (isSheriff ? 2 : 0); // Xerife com 9 PV

        updatedPlayers[id] = {
          ...data.players[id],
          character: char.name,
          ability: char.ability,
          role: role,
          hp: maxHp,
          maxHp: maxHp,
          arrows: 0,
          alive: true
        };
      });

      await update(roomRef, { status: "playing", players: updatedPlayers, arrowPool: 9 });
      logMessage("🤠 A partida começou! O Xerife foi revelado.");
    });

    function listenRoom() {
      onValue(ref(db, `rooms/${currentRoomCode}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) { alert("Sala encerrada!"); location.reload(); return; }

        renderBoard(data);
        renderDice(data.diceResults);

        const activePlayerId = data.playerOrder[data.turnIndex];
        const activePlayer = data.players[activePlayerId];
        const isMyTurn = !isSpectator && activePlayerId === localPlayerId && data.status === "playing";

        document.getElementById("arrow-count").innerText = data.arrowPool;

        if (data.host === localPlayerId && !isSpectator) {
          btnCloseRoom.classList.remove("hidden");
          if (data.status === "waiting") { btnAddBot.classList.remove("hidden"); btnStart.classList.remove("hidden"); }
          else { btnAddBot.classList.add("hidden"); btnStart.classList.add("hidden"); }
        } else { btnCloseRoom.classList.add("hidden"); btnAddBot.classList.add("hidden"); btnStart.classList.add("hidden"); }

        const hasRolledOnce = data.rollsLeft < 3;
        
        btnRoll.disabled = !isMyTurn || data.rollsLeft <= 0 || hasResolvedThisTurn || activeDicePool.length > 0;
        btnResolve.disabled = !isMyTurn || !hasRolledOnce || hasResolvedThisTurn || activeDicePool.length > 0;
        btnEnd.disabled = !isMyTurn || !hasRolledOnce || activeDicePool.length > 0;

        document.getElementById("rolls-left").innerText = data.rollsLeft;

        if (data.status === "playing") {
          document.getElementById("turn-status").innerText = isSpectator ? 
            `👀 MODO ESPECTADOR: Rodada de ${activePlayer?.name}` :
            (isMyTurn ? 
              (activeDicePool.length > 0 ? "🎯 Clique na carta verde do alvo!" : "🎲 Sua vez! Role dados ou clique em 'RESOLVER DADOS'.") : 
              `Aguardando jogada de: ${activePlayer?.name}`);

          if (activePlayer?.isBot && data.host === localPlayerId && !isSpectator) handleBotTurn(data, activePlayerId);
        }

        checkGameEnd(data);
      });
    }

    function renderBoard(data) {
      const board = document.getElementById("players-board");
      board.innerHTML = "";

      Object.entries(data.players || {}).forEach(([id, player]) => {
        const isMe = id === localPlayerId;
        const isActive = id === data.playerOrder[data.turnIndex];
        const roleText = (isMe || player.role === "Xerife" || !player.alive) ? player.role : "???";

        const div = document.createElement("div");
        div.id = `p-card-${id}`;
        div.className = `player-card ${isActive ? 'active-turn' : ''} ${isMe ? 'is-me' : ''} ${!player.alive ? 'dead' : ''}`;
        
        div.innerHTML = `
          <div class="player-name">${player.name}</div>
          <div class="player-char">${player.character || 'Pistoleiro'}</div>
          <div class="player-ability">${player.ability || ''}</div>
          <div class="player-role">${roleText}</div>
          <div class="player-stats">
            <span>❤️ ${player.hp}/${player.maxHp}</span>
            <span>🏹 ${player.arrows}</span>
          </div>
        `;

        let timer;
        div.addEventListener("touchstart", () => { timer = setTimeout(() => showModal(`👤 ${player.name}`, player), 500); });
        div.addEventListener("touchend", () => clearTimeout(timer));
        
        div.addEventListener("click", () => {
          if (div.classList.contains("targetable") && !isSpectator) handleTargetSelection(id, data);
          else showModal(`👤 ${player.name}`, player);
        });

        board.appendChild(div);

        if (isMe && player.role) document.getElementById("display-role").innerText = player.role;
      });
    }

    function renderDice(dice) {
      const container = document.getElementById("dice-container");
      container.innerHTML = "";

      (dice || ["-", "-", "-", "-", "-"]).forEach((val, i) => {
        const d = document.createElement("div");
        const isKept = keptDiceIndices.includes(i);
        const isDynamite = val === "💣";

        d.className = `die ${isKept ? 'kept' : ''} ${isDynamite ? 'locked' : ''}`;
        d.innerText = val;

        d.addEventListener("click", () => {
          if (isDynamite || activeDicePool.length > 0 || isSpectator || hasResolvedThisTurn) return;
          if (keptDiceIndices.includes(i)) keptDiceIndices = keptDiceIndices.filter(idx => idx !== i);
          else keptDiceIndices.push(i);
          renderDice(dice);
        });

        container.appendChild(d);
      });
    }

    btnRoll.addEventListener("click", async () => {
      if (isSpectator) return;
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();

      const faces = ["🎯1", "🎯2", "🍺", "🏹", "💣", "🔫"];
      let newDice = [...data.diceResults];

      for (let i = 0; i < 5; i++) {
        if (!keptDiceIndices.includes(i) && newDice[i] !== "💣") {
          newDice[i] = faces[Math.floor(Math.random() * faces.length)];
        }
      }

      let newArrowPool = data.arrowPool;
      let activePlayer = { ...data.players[localPlayerId] };

      newDice.forEach((face, idx) => {
        if (face === "🏹" && data.diceResults[idx] !== "🏹") {
          if (newArrowPool > 0) {
            newArrowPool--;
            activePlayer.arrows++;
            logMessage(`🏹 Você pegou uma flecha da reserva!`);
          }
        }
      });

      if (newArrowPool <= 0) {
        logMessage("🚨 Os Índios Atacaram! Todos perderam vida pelas suas flechas.");
        Object.keys(data.players).forEach(pId => {
          data.players[pId].hp = Math.max(0, data.players[pId].hp - data.players[pId].arrows);
          if (data.players[pId].hp === 0 && data.players[pId].alive) handlePlayerDeath(pId, "Índios", data);
          data.players[pId].arrows = 0;
        });
        newArrowPool = 9;
        activePlayer = data.players[localPlayerId];
      }

      const dynamites = newDice.filter(d => d === "💣").length;
      let newRollsLeft = data.rollsLeft - 1;

      if (dynamites >= 3) {
        logMessage("💣 3 Dinamites explodiram! Você perdeu 1 PV.");
        activePlayer.hp = Math.max(0, activePlayer.hp - 1);
        if (activePlayer.hp === 0 && activePlayer.alive) handlePlayerDeath(localPlayerId, "Dinamite", data);
        newRollsLeft = 0;
      }

      data.players[localPlayerId] = activePlayer;

      await update(roomRef, {
        diceResults: newDice,
        rollsLeft: newRollsLeft,
        arrowPool: newArrowPool,
        players: data.players
      });
    });

    btnResolve.addEventListener("click", async () => {
      if (isSpectator || hasResolvedThisTurn) return;
      hasResolvedThisTurn = true;

      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();
      const dice = data.diceResults;

      if (dice.filter(d => d === "🔫").length >= 3) {
        logMessage("🔫 METRALHADORA GATLING! Todos os outros perderam 1 PV.");
        Object.keys(data.players).forEach(pId => {
          if (pId !== localPlayerId && data.players[pId].alive) {
            data.players[pId].hp = Math.max(0, data.players[pId].hp - 1);
            if (data.players[pId].hp === 0) handlePlayerDeath(pId, data.players[localPlayerId].name, data);
          }
        });
        data.arrowPool += data.players[localPlayerId].arrows;
        data.players[localPlayerId].arrows = 0;
        await update(roomRef, { players: data.players, arrowPool: data.arrowPool });
      }

      activeDicePool = dice.filter(d => d === "🎯1" || d === "🎯2" || d === "🍺");
      
      if (activeDicePool.length === 0) {
        logMessage("Sem dados para resolver. Passando a vez automaticamente...");
        return passTurnAutomatically(data);
      }

      updatePendingUI();
      highlightCurrentTarget(data);
    });

    function updatePendingUI() {
      const box = document.getElementById("pending-box");
      const list = document.getElementById("pending-list");
      if (activeDicePool.length > 0) {
        box.classList.remove("hidden");
        list.innerText = activeDicePool.join("  ");
      } else { box.classList.add("hidden"); }
    }

    function highlightCurrentTarget(data) {
      document.querySelectorAll(".player-card").forEach(el => el.classList.remove("targetable"));
      if (activeDicePool.length === 0) return;

      const currentSymbol = activeDicePool[0];
      const aliveIds = data.playerOrder.filter(id => data.players[id].alive);
      const myIndex = aliveIds.indexOf(localPlayerId);
      const total = aliveIds.length;

      if (total <= 1) return;

      let validTargets = [];
      if (currentSymbol === '🎯1') {
        validTargets = [aliveIds[(myIndex - 1 + total) % total], aliveIds[(myIndex + 1) % total]];
        logMessage(`🎯 Resolvendo [🎯1]: Clique no alvo a Distância 1.`);
      } else if (currentSymbol === '🎯2') {
        const targetIdx = total <= 2 ? (myIndex + 1) % total : (myIndex + 2) % total;
        validTargets = [aliveIds[targetIdx]];
        logMessage(`🎯 Resolvendo [🎯2]: Clique no alvo a Distância 2.`);
      } else if (currentSymbol === '🍺') {
        validTargets = aliveIds;
        logMessage(`🍺 Resolvendo [🍺]: Clique no jogador para CURAR +1 PV.`);
      }

      validTargets.forEach(targetId => {
        const card = document.getElementById(`p-card-${targetId}`);
        if (card) card.classList.add("targetable");
      });
    }

    async function handleTargetSelection(targetId, data) {
      if (isSpectator) return;
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const target = data.players[targetId];
      const currentSymbol = activeDicePool.shift();

      if (currentSymbol === '🎯1' || currentSymbol === '🎯2') {
        target.hp = Math.max(0, target.hp - 1);
        if (target.hp === 0 && target.alive) {
          handlePlayerDeath(targetId, data.players[localPlayerId].name, data);
        } else {
          logMessage(`💥 Dado [${currentSymbol}] usado contra ${target.name}! (-1 PV)`);
        }
      } else if (currentSymbol === '🍺') {
        target.hp = Math.min(target.maxHp, target.hp + 1);
        logMessage(`🍺 Dado [🍺] usado em ${target.name}! (+1 PV)`);
      }

      await update(roomRef, { players: data.players });
      updatePendingUI();

      if (activeDicePool.length > 0) {
        highlightCurrentTarget(data);
      } else {
        document.querySelectorAll(".player-card").forEach(el => el.classList.remove("targetable"));
        logMessage("✅ Todos os dados consumidos! Passando a vez automaticamente...");
        passTurnAutomatically(data);
      }
    }

    async function passTurnAutomatically(data) {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      keptDiceIndices = [];
      activeDicePool = [];
      hasResolvedThisTurn = false;
      updatePendingUI();
      document.querySelectorAll(".player-card").forEach(el => el.classList.remove("targetable"));

      let nextIndex = (data.turnIndex + 1) % data.playerOrder.length;
      while (!data.players[data.playerOrder[nextIndex]].alive) {
        nextIndex = (nextIndex + 1) % data.playerOrder.length;
      }

      await update(roomRef, { turnIndex: nextIndex, rollsLeft: 3, diceResults: ["-", "-", "-", "-", "-"] });
    }

    function handlePlayerDeath(deadId, attackerName, data) {
      data.players[deadId].alive = false;
      const deadRole = data.players[deadId].role;
      const deadName = data.players[deadId].name;

      let counts = { "Xerife": 0, "Ajudante": 0, "Fora-da-Lei": 0, "Renegado": 0 };
      Object.values(data.players).forEach(p => {
        if (p.alive && counts[p.role] !== undefined) counts[p.role]++;
      });

      const summary = `Restantes: ${counts['Xerife']} Xerife, ${counts['Ajudante']} Ajudante(s), ${counts['Fora-da-Lei']} Fora(s)-da-Lei.`;
      logMessage(`💀 ${deadName} FOI ELIMINADO! Função: ${deadRole}. | ${summary}`);

      if (deadId === localPlayerId) {
        showModal("💀 VOCÊ FOI DERROTADO!", null, `<p style='text-align:center;'>Você perdeu! <strong>${attackerName}</strong> removeu sua última vida.</p>`);
      }
    }

    function checkGameEnd(data) {
      if (gameEnded || data.status !== "playing") return;

      let aliveSheriff = false;
      let aliveOutlaws = 0;
      let aliveRenegades = 0;

      Object.values(data.players).forEach(p => {
        if (p.alive) {
          if (p.role === "Xerife") aliveSheriff = true;
          if (p.role === "Fora-da-Lei") aliveOutlaws++;
          if (p.role === "Renegado") aliveRenegades++;
        }
      });

      if (!aliveSheriff) {
        gameEnded = true;
        showModal("🏆 FIM DE JOGO!", null, "<p style='text-align:center;'><strong>Os Foras-da-Lei Venceram!</strong><br>O Xerife foi mordido pela poeira!</p>");
      } 
      else if (aliveOutlaws === 0 && aliveRenegades === 0) {
        gameEnded = true;
        showModal("🏆 VOCÊ VENCEU!", null, "<p style='text-align:center;'><strong>Você domina o Faroeste!</strong><br>A ordem foi restaurada no Velho Oeste!</p>");
      }
    }

    btnEnd.addEventListener("click", async () => {
      if (isSpectator) return;
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      passTurnAutomatically(snapshot.val());
    });

    async function handleBotTurn(data, botId) {
      logMessage(`🤖 Turno de ${data.players[botId].name}...`);
      setTimeout(async () => {
        const roomRef = ref(db, `rooms/${currentRoomCode}`);
        const faces = ["🎯1", "🎯2", "🍺", "🏹", "💣", "🔫"];
        const dice = Array.from({ length: 5 }, () => faces[Math.floor(Math.random() * faces.length)]);
        
        let players = { ...data.players };
        const aliveIds = data.playerOrder.filter(id => players[id].alive);
        const myIndex = aliveIds.indexOf(botId);
        const total = aliveIds.length;

        if (dice.includes("🎯1") && total > 1) {
          const targetId = aliveIds[(myIndex + 1) % total];
          if (targetId !== botId) {
            players[targetId].hp = Math.max(0, players[targetId].hp - 1);
            if (players[targetId].hp === 0 && players[targetId].alive) handlePlayerDeath(targetId, players[botId].name, { players });
            logMessage(`🤖 Bot ${players[botId].name} usou 🎯1 contra ${players[targetId].name}!`);
          }
        }

        let nextIndex = (data.turnIndex + 1) % data.playerOrder.length;
        while (!players[data.playerOrder[nextIndex]].alive) nextIndex = (nextIndex + 1) % data.playerOrder.length;

        await update(roomRef, { diceResults: dice, players, turnIndex: nextIndex, rollsLeft: 3 });
      }, 2000);
    }

    function showModal(title, playerData, customHtml = null) {
      document.getElementById("modal-title").innerText = title;
      const body = document.getElementById("modal-body");

      if (customHtml) {
        body.innerHTML = customHtml;
      } else if (playerData) {
        body.innerHTML = `
          <p><strong>Personagem:</strong> ${playerData.character || 'Desconhecido'}</p>
          <p><strong>Habilidade Passiva:</strong> ${playerData.ability || 'Sem habilidade especial.'}</p>
          <p><strong>Status:</strong> ${playerData.alive ? '❤️ Vivo (' + playerData.hp + '/' + playerData.maxHp + ' PV)' : '💀 Eliminado'}</p>
        `;
      } else {
        body.innerHTML = `
          <p><strong>Objetivo por Função:</strong></p>
          <ul>
            <li><strong>Xerife:</strong> Eliminar todos os Foras da Lei e o Renegado.</li>
            <li><strong>Ajudante:</strong> Proteger o Xerife.</li>
            <li><strong>Fora da Lei:</strong> Eliminar o Xerife.</li>
            <li><strong>Renegado:</strong> Ser o único sobrevivente.</li>
          </ul>
        `;
      }
      rulesModal.classList.remove("hidden");
    }

    function logMessage(msg) {
      const box = document.getElementById("game-log");
      const p = document.createElement("p");
      p.innerText = `> ${msg}`;
      box.appendChild(p);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
