<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BANG! The Dice Game - MegaHit Games</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS E TEMAS (Clean Light & Dark Mode)
       ========================================================================== */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --secondary-color: #475569;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    body.dark-theme {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
    }

    /* ==========================================================================
       2. RESET E ESTILOS BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ==========================================================================
       3. HEADER E NAVEGAÇÃO
       ========================================================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .back-btn:hover { text-decoration: underline; }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      background-color: var(--border-color);
    }

    /* ==========================================================================
       4. ESTRUTURA DO JOGO E CONTAINERS
       ========================================================================== */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    /* ==========================================================================
       5. TELA DE LOBBY
       ========================================================================== */
    .lobby-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .lobby-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: transparent;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.875rem 1rem;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary { background-color: var(--primary-color); color: #ffffff; }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-secondary { background-color: var(--secondary-color); color: #ffffff; }
    .btn-secondary:hover { opacity: 0.9; }

    .btn-success { background-color: var(--success-color); color: #ffffff; }
    .btn-success:hover { opacity: 0.9; }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ==========================================================================
       6. TELA MESA DE JOGO (GAME BOARD)
       ========================================================================== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .badge {
      background-color: var(--border-color);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-weight: 700;
    }

    /* Grid de Jogadores */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .player-card {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      background: var(--card-bg);
      position: relative;
      transition: all 0.2s;
    }

    .player-card.active-turn {
      border-color: var(--primary-color);
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.3);
      transform: translateY(-2px);
    }

    .player-card.is-me {
      background-color: rgba(217, 119, 6, 0.05);
    }

    .player-name {
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-role {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0.25rem 0;
    }

    .player-hp {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--danger-color);
    }

    /* Área de Dados */
    .dice-area {
      background-color: var(--bg-color);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .dice-container {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }

    .die {
      width: 50px;
      height: 50px;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: var(--shadow);
      user-select: none;
    }

    .turn-message {
      font-weight: 700;
      margin-bottom: 1rem;
      min-height: 1.5em;
    }

    .game-controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="dark-theme">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <a href="../index.html" class="back-btn">← Hub</a>
      <h1>🌵 BANG! The Dice Game</h1>
    </div>
    <button id="theme-toggle" class="theme-btn">🌓 Tema</button>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <!-- LOBBY SCREEN -->
    <section id="lobby-screen" class="card">
      <div class="lobby-header">
        <h2>Entrar na Mesa</h2>
        <p>Jogue em tempo real com 2 a 8 amigos</p>
      </div>
      
      <div class="form-group">
        <input type="text" id="player-name" placeholder="Seu Apelido" maxlength="12" autocomplete="off">
        <input type="text" id="room-code" placeholder="Código da Sala (ex: BANG1)" maxlength="8" style="text-transform: uppercase;" autocomplete="off">
        
        <div class="actions-grid">
          <button id="btn-create" class="btn btn-primary">Criar Sala</button>
          <button id="btn-join" class="btn btn-secondary">Entrar</button>
        </div>
      </div>
    </section>

    <!-- MESA DO JOGO -->
    <section id="game-screen" class="card hidden">
      <div class="status-bar">
        <div>Sala: <span id="display-room-code" class="badge">---</span></div>
        <div>Sua Função: <span id="display-role" class="badge">???</span></div>
      </div>

      <!-- GRID DE JOGADORES NA MESA -->
      <div id="players-board" class="players-grid"></div>

      <!-- ÁREA DE INTERAÇÃO COM DADOS -->
      <div class="dice-area">
        <p id="turn-status" class="turn-message">Aguardando início...</p>

        <div id="dice-container" class="dice-container">
          <div class="die">-</div>
          <div class="die">-</div>
          <div class="die">-</div>
          <div class="die">-</div>
          <div class="die">-</div>
        </div>

        <div class="game-controls">
          <button id="btn-start" class="btn btn-success hidden">Iniciar Partida</button>
          <button id="btn-roll" class="btn btn-primary" disabled>🎲 Rolar Dados (<span id="rolls-left">3</span>)</button>
          <button id="btn-end" class="btn btn-secondary" disabled>Passar Vez</button>
        </div>
      </div>
    </section>
  </main>

  <!-- FIREBASE REALTIME DATABASE SDK (Modular via CDN ES6) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. CREDENCIAIS CONFIGUREDAS
    const firebaseConfig = {
      apiKey: "AIzaSyCvhEL3kMRMYhPK55tcICbLsWFHd45WgB8",
      authDomain: "megahit-games.firebaseapp.com",
      databaseURL: "https://megahit-games-default-rtdb.firebaseio.com",
      projectId: "megahit-games",
      storageBucket: "megahit-games.firebasestorage.app",
      messagingSenderId: "595034446210",
      appId: "1:595034446210:web:01f430b992d529988cd79b"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Estado da Aplicação
    let localPlayerId = "p_" + Math.random().toString(36).substring(2, 7);
    let currentRoomCode = null;

    // Elementos DOM
    const lobbyScreen = document.getElementById("lobby-screen");
    const gameScreen = document.getElementById("game-screen");
    const btnCreate = document.getElementById("btn-create");
    const btnJoin = document.getElementById("btn-join");
    const btnStart = document.getElementById("btn-start");
    const btnRoll = document.getElementById("btn-roll");
    const btnEnd = document.getElementById("btn-end");
    const themeToggle = document.getElementById("theme-toggle");

    // Alternador de Tema Claro/Escuro
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-theme");
    });

    // Entrar ou Criar Sala
    btnCreate.addEventListener("click", () => handleRoomAccess(true));
    btnJoin.addEventListener("click", () => handleRoomAccess(false));

    async function handleRoomAccess(isHost) {
      const name = document.getElementById("player-name").value.trim() || "Pistoleiro";
      const code = document.getElementById("room-code").value.trim().toUpperCase();

      if (!code) return alert("Por favor, digite um código de sala!");
      currentRoomCode = code;

      const roomRef = ref(db, `rooms/${code}`);
      const snapshot = await get(roomRef);

      if (isHost) {
        if (snapshot.exists()) return alert("Essa sala já foi criada! Escolha outro código ou entre nela.");

        const initialData = {
          status: "waiting",
          host: localPlayerId,
          turnIndex: 0,
          playerOrder: [localPlayerId],
          rollsLeft: 3,
          diceResults: ["-", "-", "-", "-", "-"],
          players: {
            [localPlayerId]: { name, hp: 4, maxHp: 4, role: "Aguardando", alive: true }
          }
        };

        await set(roomRef, initialData);
      } else {
        if (!snapshot.exists()) return alert("Sala não encontrada! Verifique o código.");
        
        const data = snapshot.val();
        if (Object.keys(data.players || {}).length >= 8) return alert("Mesa cheia! Máximo 8 jogadores.");

        await update(ref(db, `rooms/${code}/players/${localPlayerId}`), {
          name, hp: 4, maxHp: 4, role: "Aguardando", alive: true
        });

        const newOrder = [...(data.playerOrder || []), localPlayerId];
        await update(ref(db, `rooms/${code}`), { playerOrder: newOrder });
      }

      // Transição de Telas
      lobbyScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      document.getElementById("display-room-code").innerText = code;

      // Iniciar Ouvinte em Tempo Real
      listenToRoom();
    }

    // Listener Realtime
    function listenToRoom() {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        renderPlayers(data);
        renderDice(data.diceResults);

        const activePlayerId = data.playerOrder[data.turnIndex];
        const isMyTurn = activePlayerId === localPlayerId && data.status === "playing";

        // Botões de Ação
        btnRoll.disabled = !isMyTurn || data.rollsLeft <= 0;
        btnEnd.disabled = !isMyTurn;
        document.getElementById("rolls-left").innerText = data.rollsLeft;

        // Status
        if (data.status === "waiting") {
          document.getElementById("turn-status").innerText = "Aguardando o criador iniciar a partida...";
        } else {
          document.getElementById("turn-status").innerText = isMyTurn ? 
            "🎯 É A SUA VEZ DE JOGAR!" : 
            `Aguardando jogada de: ${data.players[activePlayerId]?.name || 'Pistoleiro'}`;
        }

        // Exibir Iniciar para o Criador da Sala
        if (data.host === localPlayerId && data.status === "waiting") {
          btnStart.classList.remove("hidden");
        } else {
          btnStart.classList.add("hidden");
        }
      });
    }

    // Iniciar Partida (Sorteio de Funções para 2 a 8 Jogadores)
    btnStart.addEventListener("click", async () => {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();

      const playersKeys = data.playerOrder;
      const count = playersKeys.length;

      let roles = [];
      if (count === 2) roles = ["Xerife", "Fora-da-Lei"];
      else if (count === 3) roles = ["Xerife", "Fora-da-Lei", "Renegado"];
      else if (count === 4) roles = ["Xerife", "Ajudante", "Fora-da-Lei", "Renegado"];
      else {
        roles = ["Xerife", "Ajudante", "Fora-da-Lei", "Fora-da-Lei", "Renegado", "Fora-da-Lei", "Ajudante", "Fora-da-Lei"].slice(0, count);
      }

      // Embaralhar papéis
      roles.sort(() => Math.random() - 0.5);

      const updatedPlayers = {};
      playersKeys.forEach((id, idx) => {
        const r = roles[idx];
        const isSheriff = r === "Xerife";
        updatedPlayers[id] = {
          ...data.players[id],
          role: r,
          hp: isSheriff ? 5 : 4,
          maxHp: isSheriff ? 5 : 4
        };
      });

      await update(roomRef, {
        status: "playing",
        players: updatedPlayers
      });
    });

    // Renderizar Jogadores
    function renderPlayers(data) {
      const board = document.getElementById("players-board");
      board.innerHTML = "";

      const activePlayerId = data.playerOrder[data.turnIndex];

      Object.entries(data.players || {}).forEach(([id, player]) => {
        const isMe = id === localPlayerId;
        const isActive = id === activePlayerId;
        
        // Regra de Exibição do Papel (Xerife é público, outros velados)
        let roleDisplay = "???";
        if (isMe || player.role === "Xerife" || !player.alive) {
          roleDisplay = player.role;
        }

        const div = document.createElement("div");
        div.className = `player-card ${isActive ? 'active-turn' : ''} ${isMe ? 'is-me' : ''}`;
        div.innerHTML = `
          <div class="player-name">${player.name} ${isMe ? '(Você)' : ''}</div>
          <div class="player-role">${roleDisplay}</div>
          <div class="player-hp">❤️ ${player.hp}/${player.maxHp}</div>
        `;
        board.appendChild(div);

        if (isMe && player.role) {
          document.getElementById("display-role").innerText = player.role;
        }
      });
    }

    // Renderizar Dados
    function renderDice(dice) {
      const container = document.getElementById("dice-container");
      container.innerHTML = "";
      (dice || ["-", "-", "-", "-", "-"]).forEach(val => {
        const d = document.createElement("div");
        d.className = "die";
        d.innerText = val;
        container.appendChild(d);
      });
    }

    // Rolar Dados
    btnRoll.addEventListener("click", async () => {
      const faces = ["💥 1", "💥 2", "🍺", "🏹", "💣", "🎯"];
      const newDice = Array.from({ length: 5 }, () => faces[Math.floor(Math.random() * faces.length)]);

      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();

      await update(roomRef, {
        diceResults: newDice,
        rollsLeft: data.rollsLeft - 1
      });
    });

    // Passar Vez
    btnEnd.addEventListener("click", async () => {
      const roomRef = ref(db, `rooms/${currentRoomCode}`);
      const snapshot = await get(roomRef);
      const data = snapshot.val();

      const nextIndex = (data.turnIndex + 1) % data.playerOrder.length;

      await update(roomRef, {
        turnIndex: nextIndex,
        rollsLeft: 3,
        diceResults: ["-", "-", "-", "-", "-"]
      });
    });
  </script>
</body>
</html>
