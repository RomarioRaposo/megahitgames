<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defense - MegaHit Games</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <header id="top-hud">
        <a href="../index.html" class="btn-hub">◀ Hub</a>
        <div class="hud-card">Onda: <b id="wave-num">1</b></div>
        <div class="hud-card">HP Ast: <b id="ast-hp">10</b></div>
        <div class="hud-card">Dano/s: <b id="ast-dmg">2</b></div>
        <div class="hud-card gold">🪙 <b id="gold-display">0</b></div>
        <button id="btn-speed" onclick="toggleSpeed()">⚡ 1x</button>
    </header>

    <main id="game-container">
        <canvas id="gameCanvas"></canvas>
    </main>

    <footer id="bottom-hud">
        <div class="shop-grid">
            <button class="btn-upgrade" onclick="buyUpgrade('atkSpeed')">
                <b>Atk Speed</b><br>
                Nv: <span id="lvl-atkSpeed">1</span> | 🪙<span id="cost-atkSpeed">15</span>
            </button>
            <button class="btn-upgrade" onclick="buyUpgrade('damage')">
                <b>Dano</b><br>
                Nv: <span id="lvl-damage">1</span> | 🪙<span id="cost-damage">10</span>
            </button>
            <button class="btn-upgrade" onclick="buyUpgrade('hp')">
                <b>HP Máx</b><br>
                Nv: <span id="lvl-hp">1</span> | 🪙<span id="cost-hp">20</span>
            </button>
            <button class="btn-upgrade" onclick="buyUpgrade('hpRegen')">
                <b>Regen/s</b><br>
                Nv: <span id="lvl-hpRegen">0</span> | 🪙<span id="cost-hpRegen">25</span>
            </button>
            <button class="btn-upgrade" onclick="buyUpgrade('goldWave')">
                <b>Bônus Onda</b><br>
                Nv: <span id="lvl-goldWave">1</span> | 🪙<span id="cost-goldWave">30</span>
            </button>
            <button class="btn-upgrade" onclick="buyUpgrade('goldKill')">
                <b>Bônus Abate</b><br>
                Nv: <span id="lvl-goldKill">1</span> | 🪙<span id="cost-goldKill">40</span>
            </button>
        </div>
    </footer>

    <div id="ranking-modal" class="modal">
        <div class="modal-content">
            <h2>🏆 Top 10 Defensores</h2>
            <ol id="ranking-list"></ol>
            <button id="btn-restart" onclick="resetGame()">Jogar Novamente</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
