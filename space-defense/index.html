<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defense - MegaHit Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        canvas { display: block; width: 100%; height: 100%; }
        .hud-glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-upgrade { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; transition: all 0.15s ease; }
        .btn-upgrade:hover:not(:disabled) { border-color: #3b82f6; transform: translateY(-1px); background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-upgrade:active:not(:disabled) { transform: translateY(0); }
        .btn-upgrade:disabled { opacity: 0.4; cursor: not-allowed; border-color: #1e293b; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- HUD SUPERIOR -->
    <header class="hud-glass px-3 py-1.5 sm:px-4 sm:py-2 flex items-center justify-between text-xs sm:text-sm z-10 shadow-lg">
        <div class="flex items-center gap-2 sm:gap-3">
            <a href="../../index.html" class="flex items-center gap-1 font-bold text-blue-400 hover:text-blue-300 transition text-xs sm:text-sm">
                <span>◀</span> <span class="hidden sm:inline">Hub</span>
            </a>
            <div class="h-3 w-[1px] bg-slate-700"></div>
            <div class="bg-blue-950/80 border border-blue-500/30 px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-blue-300 font-bold text-xs">
                Onda <span id="hud-wave" class="text-white text-sm sm:text-base">1</span>
            </div>
        </div>

        <!-- STATUS INIMIGOS -->
        <div class="hidden md:flex items-center gap-4 text-slate-300">
            <div class="flex items-center gap-1">
                <span class="text-slate-400">HP Inimigo:</span>
                <span id="hud-ast-hp" class="font-bold text-red-400">10</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-slate-400">Ataque/s:</span>
                <span id="hud-ast-dmg" class="font-bold text-amber-400">2/s</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- BOTÃO VELOCIDADE (1x - 4x) -->
            <button id="btn-speed" onclick="toggleSpeed()" class="bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/40 text-cyan-300 font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full transition text-[11px] sm:text-xs flex items-center gap-1">
                ⚡ <span id="speed-label">1x</span>
            </button>

            <!-- OURO -->
            <div class="bg-amber-950/60 border border-amber-500/30 px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-amber-300 font-bold flex items-center gap-1 text-xs">
                <span>🪙</span> <span id="hud-gold" class="text-amber-400 text-xs sm:text-base">0</span>
            </div>

            <!-- RANKING -->
            <button onclick="toggleRankingModal(true)" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[11px] sm:text-xs font-semibold text-slate-200 transition">
                🏆 Rank
            </button>
        </div>
    </header>

    <!-- ÁREA CENTRAL DO CANVAS -->
    <main class="flex-1 relative bg-slate-950 overflow-hidden" id="canvas-container">
        <canvas id="gameCanvas"></canvas>

        <!-- STATUS FLUTUANTE DA NAVE (HP) -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 hud-glass px-3 py-1 rounded-full flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs shadow-md border border-slate-700/50 pointer-events-none">
            <div class="flex items-center gap-1">
                <span class="text-emerald-400 font-bold">HP:</span>
                <span id="hud-ship-hp" class="font-extrabold text-white">100/100</span>
            </div>
            <div class="w-16 sm:w-20 bg-slate-800 h-1.5 sm:h-2 rounded-full overflow-hidden border border-slate-700">
                <div id="hud-hp-bar" class="bg-emerald-500 h-full w-full transition-all duration-150"></div>
            </div>
            <span id="hud-ship-regen" class="text-emerald-400/80 font-semibold text-[9px] sm:text-[10px]">+0/s</span>
        </div>
    </main>

    <!-- HUD INFERIOR: LOJA (COMPACTA NO MOBILE) -->
    <footer class="hud-glass p-1.5 sm:p-2.5 z-10 border-t border-slate-800">
        <div class="max-w-4xl mx-auto grid grid-cols-3 sm:grid-cols-3 lg:grid-cols-6 gap-1.5 sm:gap-2">
            <button id="btn-upgrade-atkSpeed" onclick="buyUpgrade('atkSpeed')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-blue-300">⚡ Atk Spd</span>
                    <span id="lvl-atkSpeed" class="text-[9px] sm:text-[10px] bg-blue-900/60 text-blue-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 1</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Cadência</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-atkSpeed">15</span></div>
            </button>

            <button id="btn-upgrade-damage" onclick="buyUpgrade('damage')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-red-300">⚔️ Dano</span>
                    <span id="lvl-damage" class="text-[9px] sm:text-[10px] bg-red-900/60 text-red-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 1</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Por tiro</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-damage">10</span></div>
            </button>

            <button id="btn-upgrade-hp" onclick="buyUpgrade('hp')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-emerald-300">🛡️ Max HP</span>
                    <span id="lvl-hp" class="text-[9px] sm:text-[10px] bg-emerald-900/60 text-emerald-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 1</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Vida Nave</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-hp">20</span></div>
            </button>

            <button id="btn-upgrade-hpRegen" onclick="buyUpgrade('hpRegen')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-teal-300">💖 Regen</span>
                    <span id="lvl-hpRegen" class="text-[9px] sm:text-[10px] bg-teal-900/60 text-teal-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 0</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Cura/seg</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-hpRegen">25</span></div>
            </button>

            <button id="btn-upgrade-goldWave" onclick="buyUpgrade('goldWave')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-amber-300">💰 +Onda</span>
                    <span id="lvl-goldWave" class="text-[9px] sm:text-[10px] bg-amber-900/60 text-amber-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 1</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Bônus Onda</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-goldWave">30</span></div>
            </button>

            <button id="btn-upgrade-goldKill" onclick="buyUpgrade('goldKill')" class="btn-upgrade p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-left flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] sm:text-[11px] font-bold text-yellow-300">🎯 +Abate</span>
                    <span id="lvl-goldKill" class="text-[9px] sm:text-[10px] bg-yellow-900/60 text-yellow-200 px-1 py-0.2 sm:px-1.5 sm:py-0.5 rounded font-mono">Nv 1</span>
                </div>
                <div class="text-[9px] sm:text-[10px] text-slate-400 mt-0.5">Por Abate</div>
                <div class="mt-0.5 text-[10px] sm:text-xs font-bold text-amber-400">🪙 <span id="cost-goldKill">40</span></div>
            </button>
        </div>
    </footer>

    <!-- MODAL RECOMPENSA DO CHEFE (POWER-UPS DE TIRO) -->
    <div id="boss-reward-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-blue-500/40 rounded-2xl max-w-md w-full p-5 text-center shadow-2xl relative animate-bounce-short">
            <div class="text-4xl mb-2">👑</div>
            <h2 class="text-xl font-extrabold text-blue-400 mb-1">CHEFE DERROTADO!</h2>
            <p class="text-xs text-slate-300 mb-4">Escolha uma Modificação de Armamento Especial para sua nave:</p>

            <div class="space-y-3">
                <button onclick="selectBossReward('bounce')" class="w-full bg-slate-800 hover:bg-blue-900/50 border border-slate-700 hover:border-blue-400 p-3 rounded-xl text-left transition flex items-center gap-3">
                    <div class="text-2xl p-2 bg-blue-950 rounded-lg">🎯</div>
                    <div>
                        <div class="text-xs font-bold text-blue-300">Tiro Ricochete <span id="reward-lvl-bounce" class="text-[10px] bg-blue-900 text-blue-200 px-1 rounded">Nv 1</span></div>
                        <div class="text-[11px] text-slate-400">O tiro rebate e busca +1 asteroide próximo com dano mantido.</div>
                    </div>
                </button>

                <button onclick="selectBossReward('parallel')" class="w-full bg-slate-800 hover:bg-indigo-900/50 border border-slate-700 hover:border-indigo-400 p-3 rounded-xl text-left transition flex items-center gap-3">
                    <div class="text-2xl p-2 bg-indigo-950 rounded-lg">⚡</div>
                    <div>
                        <div class="text-xs font-bold text-indigo-300">Tiro Duplo / Sequenciado <span id="reward-lvl-parallel" class="text-[10px] bg-indigo-900 text-indigo-200 px-1 rounded">Nv 1</span></div>
                        <div class="text-[11px] text-slate-400">Dispara +1 projétil paralelo em linha reta a cada ataque.</div>
                    </div>
                </button>

                <button onclick="selectBossReward('spread')" class="w-full bg-slate-800 hover:bg-cyan-900/50 border border-slate-700 hover:border-cyan-400 p-3 rounded-xl text-left transition flex items-center gap-3">
                    <div class="text-2xl p-2 bg-cyan-950 rounded-lg">💥</div>
                    <div>
                        <div class="text-xs font-bold text-cyan-300">Multi-Tiro em Leque <span id="reward-lvl-spread" class="text-[10px] bg-cyan-900 text-cyan-200 px-1 rounded">Nv 1</span></div>
                        <div class="text-[11px] text-slate-400">Dispara projéteis adicionais em ângulos divergentes de 15°.</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL RANKING & GAME OVER -->
    <div id="ranking-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl relative">
            <button onclick="toggleRankingModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-xl">✕</button>
            <div id="modal-header-icon" class="text-4xl mb-2">🏆</div>
            <h2 id="modal-title" class="text-xl font-extrabold text-white mb-1">Top 10 Defensores Espaciais</h2>
            <p id="modal-subtitle" class="text-xs text-slate-400 mb-4">Classificação global registrada via Firebase</p>

            <div class="bg-slate-950 rounded-xl p-3 border border-slate-800 mb-4 max-h-56 overflow-y-auto">
                <ol id="ranking-list" class="space-y-1.5 text-xs text-left">
                    <li class="text-slate-500 text-center py-2">Carregando pontuações...</li>
                </ol>
            </div>

            <div id="game-over-controls" class="hidden flex-col gap-3">
                <div class="bg-red-950/40 border border-red-500/30 p-3 rounded-xl text-left">
                    <div class="text-xs text-red-300 font-semibold mb-1">Você resistiu até a Onda: <b id="final-wave" class="text-white text-sm">1</b></div>
                    <input type="text" id="player-name" placeholder="Digite seu nome para o Ranking..." maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="submitScoreAndRestart()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                    Salvar Pontuação & Recomeçar
                </button>
            </div>
        </div>
    </div>

    <script>
        /* CONFIGURAÇÃO DO FIREBASE */
        const firebaseConfig = {
            apiKey: "AIzaSyCvhEL3kMRMYhPK55tcICbLsWFHd45WgB8",
            authDomain: "megahit-games.firebaseapp.com",
            databaseURL: "https://megahit-games-default-rtdb.firebaseio.com",
            projectId: "megahit-games",
            storageBucket: "megahit-games.firebasestorage.app",
            messagingSenderId: "595034446210",
            appId: "1:595034446210:web:01f430b992d529988cd79b"
        };

        let db = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase fallback mode: Local Leaderboard active");
        }

        /* CANVAS SETUP */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /* CONTROLE DE VELOCIDADE */
        let gameSpeed = 1;
        const speedList = [1, 2, 3, 4];
        function toggleSpeed() {
            const idx = speedList.indexOf(gameSpeed);
            gameSpeed = speedList[(idx + 1) % speedList.length];
            document.getElementById('speed-label').innerText = `${gameSpeed}x`;
        }

        /* AUDIO SYSTEM */
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        function playLaserSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playExplosionSound(isBoss = false) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(isBoss ? 120 : 200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + (isBoss ? 0.4 : 0.2));
                gain.gain.setValueAtTime(isBoss ? 0.25 : 0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + (isBoss ? 0.4 : 0.2));
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (isBoss ? 0.4 : 0.2));
            } catch(e) {}
        }

        /* ESTADO DO JOGO */
        const game = {
            wave: 1,
            gold: 0,
            gameOver: false,
            isPaused: false,
            asteroidsInWave: 10,
            asteroidsSpawned: 0,
            asteroidsDefeated: 0,
            lastShotTime: 0,
            scoreSubmitted: false
        };

        const ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            attackRange: 190,
            hp: 100,
            maxHp: 100,
            hpRegen: 0,
            damage: 10,
            atkSpeed: 1.5,
            goldPerWave: 25,
            goldPerKill: 2,
            angle: 0,
            // POWER-UPS DA NAVE
            specialBounce: 0,    // Nv de Ricochete (quiques extras)
            specialParallel: 1,  // Nv de Tiros Paralelos (1 = normal)
            specialSpread: 0     // Nv de Leque (0 = desativado, 1 = +2 tiros laterais)
        };

        const upgrades = {
            atkSpeed: { lvl: 1, cost: 15, scale: 1.45 },
            damage:   { lvl: 1, cost: 10, scale: 1.40 },
            hp:       { lvl: 1, cost: 20, scale: 1.35 },
            hpRegen:  { lvl: 0, cost: 25, scale: 1.50 },
            goldWave: { lvl: 1, cost: 30, scale: 1.45 },
            goldKill: { lvl: 1, cost: 40, scale: 1.50 }
        };

        let bullets = [];
        let asteroids = [];
        let particles = [];
        let stars = [];

        for (let i = 0; i < 75; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.8 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        /* ASTEROIDES ROCHOSOS */
        class Asteroid {
            constructor(type = 'small') {
                const angle = Math.random() * Math.PI * 2;
                const spawnDistance = Math.max(canvas.width, canvas.height) / 2 + 60;

                this.x = (canvas.width / 2) + Math.cos(angle) * spawnDistance;
                this.y = (canvas.height / 2) + Math.sin(angle) * spawnDistance;
                this.type = type;
                this.id = Math.random().toString(36).substr(2, 9);

                const hpMult = 1 + (game.wave * 0.18);
                const dmgMult = 1 + (game.wave * 0.12);

                if (type === 'boss') {
                    this.radius = 36;
                    this.hp = Math.floor(160 * hpMult * 2.5);
                    this.speed = 0.6;
                    this.damagePerSec = Math.floor(18 * dmgMult);
                    this.goldValue = ship.goldPerKill * 12;
                    this.color = '#ef4444';
                } else if (type === 'medium') {
                    this.radius = 22;
                    this.hp = Math.floor(25 * hpMult);
                    this.speed = 1.0;
                    this.damagePerSec = Math.floor(6 * dmgMult);
                    this.goldValue = ship.goldPerKill * 3;
                    this.color = '#f97316';
                } else {
                    this.radius = 13;
                    this.hp = Math.floor(8 * hpMult);
                    this.speed = 1.6;
                    this.damagePerSec = Math.floor(2 * dmgMult);
                    this.goldValue = ship.goldPerKill;
                    this.color = '#94a3b8';
                }
                this.maxHp = this.hp;

                this.vertices = [];
                const numVerts = Math.floor(Math.random() * 3) + 7;
                for (let i = 0; i < numVerts; i++) {
                    const a = (i / numVerts) * Math.PI * 2;
                    const r = this.radius * (0.75 + Math.random() * 0.45);
                    this.vertices.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
                }
            }

            update(deltaTime) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > ship.radius + this.radius * 0.5) {
                    this.x += (dx / dist) * this.speed * gameSpeed;
                    this.y += (dy / dist) * this.speed * gameSpeed;
                } else {
                    ship.hp -= this.damagePerSec * deltaTime * gameSpeed;
                    if (ship.hp <= 0) {
                        ship.hp = 0;
                        triggerGameOver();
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();

                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.type === 'boss' ? 18 : 4;
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.stroke();

                ctx.restore();

                if (this.hp < this.maxHp) {
                    const barWidth = this.radius * 2;
                    const barHeight = 4;
                    const barX = this.x - this.radius;
                    const barY = this.y - this.radius - 8;

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                    ctx.fillRect(barX, barY, barWidth, barHeight);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(barX, barY, (this.hp / this.maxHp) * barWidth, barHeight);
                }
            }
        }

        /* PROJÉTEIS (COM SUPORTE A RICOCHETE) */
        class Bullet {
            constructor(startX, startY, angle, target = null, bouncesLeft = 0, hitHistory = []) {
                this.x = startX;
                this.y = startY;
                this.speed = 9.5;
                this.damage = ship.damage;
                this.bouncesLeft = bouncesLeft;
                this.hitHistory = [...hitHistory];

                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;

                if (target) {
                    this.hitHistory.push(target.id);
                }
            }

            update() {
                this.x += this.vx * gameSpeed;
                this.y += this.vy * gameSpeed;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = this.bouncesLeft > 0 ? '#a855f7' : '#38bdf8'; // Roxo se tiver ricochete
                ctx.shadowColor = this.bouncesLeft > 0 ? '#c084fc' : '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }

            // Lógica para Ricochetear no próximo asteroide
            tryBounce() {
                if (this.bouncesLeft <= 0) return false;

                let nextTarget = null;
                let minDist = 220; // Raio máximo de busca do ricochete

                for (let ast of asteroids) {
                    if (this.hitHistory.includes(ast.id)) continue; // não acertar o mesmo alvo
                    const dist = Math.hypot(ast.x - this.x, ast.y - this.y);
                    if (dist < minDist) {
                        minDist = dist;
                        nextTarget = ast;
                    }
                }

                if (nextTarget) {
                    const angle = Math.atan2(nextTarget.y - this.y, nextTarget.x - this.x);
                    bullets.push(new Bullet(this.x, this.y, angle, nextTarget, this.bouncesLeft - 1, this.hitHistory));
                    return true;
                }
                return false;
            }
        }

        /* PARTÍCULAS */
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx * gameSpeed;
                this.y += this.vy * gameSpeed;
                this.life -= this.decay * gameSpeed;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        /* NAVE COM VISUAL FUTURISTA */
        function drawShip() {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);

            // Fogo do Propulsor
            ctx.beginPath();
            ctx.moveTo(-12, -5);
            ctx.lineTo(-22 - Math.random() * 8, 0);
            ctx.lineTo(-12, 5);
            ctx.fillStyle = '#f97316';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.fill();

            // Corpo
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-12, -15);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-12, 15);
            ctx.closePath();

            const shipGrad = ctx.createLinearGradient(-10, 0, 20, 0);
            shipGrad.addColorStop(0, '#0284c7');
            shipGrad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = shipGrad;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#e0f2fe';
            ctx.stroke();

            // Cabine
            ctx.beginPath();
            ctx.ellipse(3, 0, 6, 3, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        function handleSpawning() {
            if (game.asteroidsSpawned < game.asteroidsInWave && Math.random() < 0.025 * gameSpeed) {
                if (game.wave % 10 === 0) {
                    if (game.asteroidsSpawned === 0) {
                        asteroids.push(new Asteroid('boss'));
                        game.asteroidsSpawned = game.asteroidsInWave;
                    }
                } else {
                    const type = Math.random() < 0.25 ? 'medium' : 'small';
                    asteroids.push(new Asteroid(type));
                    game.asteroidsSpawned++;
                }
            }
        }

        /* DISPARO AUTOMÁTICO (COM MULTI-TIRO E LEQUE) */
        function autoShoot(now) {
            const interval = 1000 / (ship.atkSpeed * gameSpeed);
            if (now - game.lastShotTime < interval) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            let nearest = null;
            let minDist = ship.attackRange;

            for (let ast of asteroids) {
                const dist = Math.hypot(ast.x - centerX, ast.y - centerY);
                if (dist <= minDist) {
                    minDist = dist;
                    nearest = ast;
                }
            }

            if (nearest) {
                initAudio();
                const baseAngle = Math.atan2(nearest.y - centerY, nearest.x - centerX);
                ship.angle = baseAngle;

                // 1. Tiros Paralelos / Sequenciados
                const pCount = ship.specialParallel;
                const offsetStep = 8;
                const startOffset = -((pCount - 1) * offsetStep) / 2;

                for (let p = 0; p < pCount; p++) {
                    const perpAngle = baseAngle + Math.PI / 2;
                    const offsetX = Math.cos(perpAngle) * (startOffset + p * offsetStep);
                    const offsetY = Math.sin(perpAngle) * (startOffset + p * offsetStep);

                    bullets.push(new Bullet(centerX + offsetX, centerY + offsetY, baseAngle, nearest, ship.specialBounce));

                    // 2. Multi-Tiro em Leque
                    if (ship.specialSpread > 0) {
                        for (let s = 1; s <= ship.specialSpread; s++) {
                            const angleDev = s * (15 * Math.PI / 180);
                            bullets.push(new Bullet(centerX + offsetX, centerY + offsetY, baseAngle + angleDev, null, ship.specialBounce));
                            bullets.push(new Bullet(centerX + offsetX, centerY + offsetY, baseAngle - angleDev, null, ship.specialBounce));
                        }
                    }
                }

                playLaserSound();
                game.lastShotTime = now;
            }
        }

        function checkWaveProgress() {
            if (game.asteroidsDefeated >= game.asteroidsInWave && asteroids.length === 0) {
                const completedWave = game.wave;
                game.wave++;
                game.gold += ship.goldPerWave;
                game.asteroidsSpawned = 0;
                game.asteroidsDefeated = 0;
                game.asteroidsInWave = game.wave % 10 === 0 ? 1 : 8 + (game.wave * 2);

                // EXIBIR MODAL DE RECOMPENSA DE CHEFE A CADA 10 ONDAS
                if (completedWave % 10 === 0) {
                    triggerBossRewardModal();
                }
            }
        }

        function triggerBossRewardModal() {
            game.isPaused = true;
            document.getElementById('reward-lvl-bounce').innerText = `Nv ${ship.specialBounce + 1}`;
            document.getElementById('reward-lvl-parallel').innerText = `Nv ${ship.specialParallel}`;
            document.getElementById('reward-lvl-spread').innerText = `Nv ${ship.specialSpread + 1}`;
            document.getElementById('boss-reward-modal').classList.remove('hidden');
        }

        function selectBossReward(type) {
            if (type === 'bounce') ship.specialBounce++;
            if (type === 'parallel') ship.specialParallel++;
            if (type === 'spread') ship.specialSpread++;

            document.getElementById('boss-reward-modal').classList.add('hidden');
            game.isPaused = false;
        }

        function buyUpgrade(type) {
            initAudio();
            const u = upgrades[type];
            if (game.gold >= u.cost) {
                game.gold -= u.cost;
                u.lvl++;

                switch(type) {
                    case 'atkSpeed': ship.atkSpeed += 0.3; break;
                    case 'damage': ship.damage += 6; break;
                    case 'hp': 
                        ship.maxHp += 30; 
                        ship.hp = Math.min(ship.maxHp, ship.hp + 30); 
                        break;
                    case 'hpRegen': ship.hpRegen += 0.8; break;
                    case 'goldWave': ship.goldPerWave += 12; break;
                    case 'goldKill': ship.goldPerKill += 1; break;
                }

                u.cost = Math.floor(u.cost * u.scale);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('hud-wave').innerText = game.wave;
            document.getElementById('hud-gold').innerText = Math.floor(game.gold);

            const hpBase = Math.floor(10 * (1 + game.wave * 0.18));
            const dmgBase = Math.floor(2 * (1 + game.wave * 0.12));
            document.getElementById('hud-ast-hp').innerText = hpBase;
            document.getElementById('hud-ast-dmg').innerText = `${dmgBase}/s`;

            document.getElementById('hud-ship-hp').innerText = `${Math.ceil(ship.hp)}/${ship.maxHp}`;
            document.getElementById('hud-ship-regen').innerText = `+${ship.hpRegen.toFixed(1)}/s`;
            const hpPercent = Math.max(0, (ship.hp / ship.maxHp) * 100);
            document.getElementById('hud-hp-bar').style.width = `${hpPercent}%`;

            for (let key in upgrades) {
                const u = upgrades[key];
                const btn = document.getElementById(`btn-upgrade-${key}`);
                const lvlSpan = document.getElementById(`lvl-${key}`);
                const costSpan = document.getElementById(`cost-${key}`);

                if (lvlSpan) lvlSpan.innerText = `Nv ${u.lvl}`;
                if (costSpan) costSpan.innerText = u.cost;
                if (btn) btn.disabled = game.gold < u.cost;
            }
        }

        function toggleRankingModal(show) {
            const modal = document.getElementById('ranking-modal');
            if (show) {
                modal.classList.remove('hidden');
                loadRanking();
            } else {
                modal.classList.add('hidden');
            }
        }

        function triggerGameOver() {
            game.gameOver = true;
            initAudio();
            playExplosionSound(true);

            document.getElementById('final-wave').innerText = game.wave;
            document.getElementById('modal-header-icon').innerText = '💥';
            document.getElementById('modal-title').innerText = 'Fim de Jogo!';
            document.getElementById('modal-subtitle').innerText = 'Sua nave foi destruída pelos asteroides.';
            document.getElementById('game-over-controls').classList.remove('hidden');
            document.getElementById('game-over-controls').classList.add('flex');
            
            toggleRankingModal(true);
        }

        function submitScoreAndRestart() {
            if (game.scoreSubmitted) return;
            const nameInput = document.getElementById('player-name').value.trim() || "Piloto Anônimo";
            
            if (db) {
                db.ref('ranking_space_defense').push({
                    name: nameInput,
                    wave: game.wave,
                    date: new Date().toISOString()
                });
            } else {
                let localScores = JSON.parse(localStorage.getItem('megahit_sd_scores') || '[]');
                localScores.push({ name: nameInput, wave: game.wave });
                localScores.sort((a,b) => b.wave - a.wave);
                localStorage.setItem('megahit_sd_scores', JSON.stringify(localScores.slice(0, 10)));
            }

            game.scoreSubmitted = true;
            location.reload();
        }

        function loadRanking() {
            const listEl = document.getElementById('ranking-list');
            listEl.innerHTML = '<li class="text-slate-500 text-center py-2">Buscando Melhores Pilotos...</li>';

            if (db) {
                db.ref('ranking_space_defense').orderByChild('wave').limitToLast(10).once('value', (snapshot) => {
                    listEl.innerHTML = '';
                    let scores = [];
                    snapshot.forEach(child => scores.push(child.val()));
                    scores.reverse();

                    if (scores.length === 0) {
                        listEl.innerHTML = '<li class="text-slate-500 text-center py-2">Nenhuma pontuação registrada ainda. Seja o primeiro!</li>';
                        return;
                    }

                    scores.forEach((data, index) => {
                        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                        const li = document.createElement('li');
                        li.className = "flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800";
                        li.innerHTML = `
                            <span class="font-bold text-slate-200"><span class="mr-2">${medal}</span>${data.name}</span>
                            <span class="font-extrabold text-blue-400">Onda ${data.wave}</span>
                        `;
                        listEl.appendChild(li);
                    });
                });
            } else {
                let localScores = JSON.parse(localStorage.getItem('megahit_sd_scores') || '[]');
                listEl.innerHTML = '';
                if (localScores.length === 0) {
                    listEl.innerHTML = '<li class="text-slate-500 text-center py-2">Sem pontuações salvas.</li>';
                    return;
                }
                localScores.forEach((data, index) => {
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800";
                    li.innerHTML = `
                        <span class="font-bold text-slate-200"><span class="mr-2">${medal}</span>${data.name}</span>
                        <span class="font-extrabold text-blue-400">Onda ${data.wave}</span>
                    `;
                    listEl.appendChild(li);
                });
            }
        }

        /* LOOP PRINCIPAL */
        let lastTime = performance.now();

        function gameLoop(now) {
            if (game.gameOver) return;

            const deltaTime = (now - lastTime) / 1000;
            lastTime = now;

            if (!game.isPaused) {
                ship.x = canvas.width / 2;
                ship.y = canvas.height / 2;

                if (ship.hp < ship.maxHp) {
                    ship.hp = Math.min(ship.maxHp, ship.hp + (ship.hpRegen * deltaTime * gameSpeed));
                }

                handleSpawning();
                autoShoot(now);

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Estrelas
                ctx.fillStyle = '#ffffff';
                for (let star of stars) {
                    ctx.globalAlpha = star.alpha;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Raio de Alcance
                ctx.beginPath();
                ctx.arc(ship.x, ship.y, ship.attackRange, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Nave
                drawShip();

                // Projétil vs Asteroide
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.update();
                    b.draw();

                    for (let j = asteroids.length - 1; j >= 0; j--) {
                        let ast = asteroids[j];
                        if (Math.hypot(b.x - ast.x, b.y - ast.y) < ast.radius + 4) {
                            ast.hp -= b.damage;
                            createExplosion(b.x, b.y, '#38bdf8', 4);

                            // Lógica de Ricochete
                            const bounced = b.tryBounce();
                            bullets.splice(i, 1);

                            if (ast.hp <= 0) {
                                game.gold += ast.goldValue;
                                createExplosion(ast.x, ast.y, ast.color, ast.type === 'boss' ? 24 : 10);
                                playExplosionSound(ast.type === 'boss');
                                asteroids.splice(j, 1);
                                game.asteroidsDefeated++;
                                checkWaveProgress();
                            }
                            break;
                        }
                    }

                    if (b && (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height)) {
                        bullets.splice(i, 1);
                    }
                }

                // Asteroides
                for (let ast of asteroids) {
                    ast.update(deltaTime);
                    ast.draw();
                }

                // Partículas
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.update();
                    p.draw();
                    if (p.life <= 0) particles.splice(i, 1);
                }

                updateUI();
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
